
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTech GPT - AI Study Assistant</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">
        <h2>🎓 BTech GPT</h2>
        <p class="tagline">Your AI Study Partner</p>

        <button class="new-chat" onclick="newChat()">+ New Chat</button>

        <nav>
            <a href="#" class="active">🏠 Dashboard</a>
            <a href="#" onclick="showTool('Exam Preparation'); return false;">📚 Exam Preparation</a>
            <a href="#" onclick="showTool('Coding Assistant'); return false;">💻 Coding Assistant</a>
            <a href="#" onclick="showTool('Study Notes'); return false;">📖 Study Notes</a>
            <a href="#" onclick="showTool('Quiz Generator'); return false;">🧠 Quiz Generator</a>
        </nav>

        <div class="premium">
            <h3>⭐ Premium Plan</h3>
            <p>Unlock more study features.</p>
        </div>
    </aside>

    <main class="main-content">

        <header>
            <h1>Welcome to BTech GPT 👋</h1>
            <p>Your personal AI assistant for engineering studies.</p>
        </header>

        <section class="chat-section">

            <h2>Ask Your Question</h2>

            <label for="branch">Select Your Branch</label>
            <select id="branch">
                <option value="">Choose Branch</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Computer Science Engineering">Computer Science Engineering</option>
                <option value="Electronics and Communication Engineering">ECE</option>
                <option value="Electrical and Electronics Engineering">EEE</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
                <option value="Civil Engineering">Civil Engineering</option>
                <option value="Other">Other</option>
            </select>

            <label for="year">Select Your Year</label>
            <select id="year">
                <option value="">Choose Year</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
            </select>

            <label for="question">Enter Your Question</label>
            <textarea id="question"
                placeholder="Ask any B.Tech question here..."></textarea>

            <button onclick="sendMessage()">Send Question ➤</button>

            <div id="response">
                Your AI answers will appear here.
            </div>

        </section>

    </main>
</div>

<script src="/script.js"></script>

</body>
</html>
